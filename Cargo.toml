[workspace]
resolver = "3"
members = ["crates/dati-core", "crates/dati-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/dati/dati-rs"

[workspace.dependencies]
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
bcrypt = "0.17"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures-util = "0.3"
hex = "0.4"
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto"] }
rand = "0.9"
rust-embed = { version = "8", features = ["mime-guess"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "any",
    "sqlite",
    "mysql",
    "postgres",
    "json",
    "derive",
] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

dati-core = { path = "crates/dati-core" }

[profile.dev]
opt-level = 0
incremental = true
codegen-units = 256
panic = "unwind"
rpath = false
lto = false
debug = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

